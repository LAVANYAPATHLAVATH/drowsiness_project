<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Drowsiness Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Driver Drowsiness Detection</h1>
    <p class="subtitle">Real-Time AI Driver Safety Monitoring</p>

    <section class="camera-box">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="cameraMessage">Camera is not started</div>
    </section>

    <div class="status-card">
      <h2 id="status">Not Started</h2>
      <p id="earValue">EAR: --</p>
    </div>

    <div class="buttons">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn">Stop Camera</button>
    </div>

    <p id="message">Click Start Camera to begin detection.</p>
    <p class="note">For demonstration only. Not a replacement for safe driving.</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
